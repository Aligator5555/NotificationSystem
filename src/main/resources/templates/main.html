<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Система оповещения 3728</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid px-0" style="background: rgba(14,14,14,0.7)">
    <div class="d-flex gap-2 align-items-center p-2">
        <a href="/" class="btn btn-outline-danger">Тревоги</a>
        <a href="/list" class="btn btn-outline-info">Абоненты</a>
        <button type="button" class="btn btn-outline-success">Мониторинг</button>
        <button type="button" class="btn btn-outline-primary">Архив</button>
        <button type="button" class="btn btn-outline-warning">Журнал</button>
    </div>
</div>

<div class="container-fluid px-0">
    <div class="d-flex gap-2 align-items-center p-2">
      <h1>Список тревог</h1>
    </div>
</div>
<div class="container-fluid px-0">
    <div class="row">
        <div class="col-2">

        </div>
        <div class="col-8">
            <div class="d-flex justify-content-between align-items-center p-2 gap-2">
                <!-- Слева -->
                <div class="d-flex gap-2 align-items-center">
                </div>

                <!-- Справа -->
                <div class="d-flex gap-2 align-items-center">
                    <a href="/saveAlarm" class="btn btn-success">Создать тревогу</a>
                </div>
            </div>
        </div>
        <div class="col-2">

        </div>
    </div>
</div>
<div class="container-fluid">
    <div class="row">
        <div class="col-2">

        </div>
        <div class="col-8">
            <table class="table table-dark table-striped">
                <thead>
                <tr>
                    <th scope="col">№</th>
                    <th scope="col">Название</th>
                    <th scope="col">Описание</th>
                    <th scope="col">Запуск сигнала</th>
                    <th scope="col">Удалить</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alarm, stat : ${alarms}" >
                    <th th:text="${stat.count}" scope="col">№</th>
                    <th th:text="${alarm.nameAlarm}" scope="col">Название</th>
                    <th th:text="${alarm.descriptionAlarm}" scope="col">Описание</th>
                    <th  scope="col">
                        <a href="/saveAlarm" class="btn btn-success">Запустить</a>
                    </th>
                    <th  scope="col">
                        <a th:href="@{/deleteAlarm/{id}(id=${alarm.id})}"
                           onclick="return confirm('Вы уверены, что хотите удалить этот контакт?');"
                           type="button"><img src="/img/Минус.png"  width="20" height="20" style="vertical-align: middle;
                                margin-right: 5px;"></a>
                    </th>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-2">

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
