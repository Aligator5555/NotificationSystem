<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Система оповещения 3728 - Добавить тревогу</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<!-- Навигация -->
<div class="container-fluid px-0" style="background: rgba(14,14,14,0.95);">
    <div class="d-flex gap-2 align-items-center p-3">
        <a href="/" class="btn btn-outline-danger">Тревоги</a>
        <a href="/list" class="btn btn-outline-info">Абоненты</a>
        <span class="btn btn-secondary disabled">Мониторинг</span>
        <span class="btn btn-secondary disabled">Архив</span>
        <span class="btn btn-secondary disabled">Журнал</span>
    </div>
</div>

<!-- Основной контент -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0" style="background-color: rgba(0,0,0,0.85);">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center mb-4 fw-bold">Добавить новую тревогу</h2>

                        <!-- Блок вывода ошибок -->
                        <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}">
                        </div>

                        <form action="/saveAlarm" method="post">

                            <!-- Название тревоги -->
                            <div class="mb-3">
                                <label for="nameAlarm" class="form-label">Название тревоги *</label>
                                <input type="text"
                                       class="form-control bg-secondary text-white border-white"
                                       id="nameAlarm"
                                       name="nameAlarm"
                                       placeholder="Например: Пожар в цехе №1"
                                       required>
                            </div>

                            <!-- Сигнал (Выбор по ID) -->
                            <div class="mb-3">
                                <label for="signalId" class="form-label">Аудиосигнал *</label>
                                <select class="form-select bg-secondary text-white border-white" id="signalId" name="nameSignal" required>
                                    <option value="" disabled selected>-- Выберите сигнал из списка --</option>
                                    <!-- Thymeleaf подставит варианты из модели signals -->
                                    <option th:each="s : ${signals}"
                                            th:value="${s.id}"
                                            th:text="${s.nameSignal + ' (' + s.filePath + ')'}">
                                    </option>
                                </select>
                            </div>

                            <!-- Описание -->
                            <div class="mb-3">
                                <label for="descriptionAlarm" class="form-label">Описание</label>
                                <textarea class="form-control bg-secondary text-white border-white"
                                          id="descriptionAlarm"
                                          name="descriptionAlarm"
                                          rows="3"
                                          placeholder="Детали сценария..."></textarea>
                            </div>

                            <!-- Кнопка отправки -->
                            <button type="submit" class="btn btn-primary w-100 text-bold"
                                    style="background-color: #c82333; border: none; padding: 12px; font-size: 1.1rem;">
                                Сохранить тревогу
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap JS Bundle (Popper + Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
