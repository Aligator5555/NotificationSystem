spring.application.name=NotificationSystem3728


spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql:3306/NotificationSystem3728?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.hikari.maximum-pool-size=10
server.port=8080
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=10000
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.sounds.dir=${APP_SOUNDS_DIR:/data/sounds}
asterisk.host=asterisk
asterisk.port=5038
asterisk.user=admin
asterisk.secret=adminpassword

