[general]
static=yes
writeprotect=no

[globals]
; Контекст по умолчанию
CONTEXT_DEFAULT=default
; Настройки тайм-аутов
DIAL_TIMEOUT=30     ; Таймаут для Dial в секундах
PLAYBACK_TIMEOUT=30 ; Таймаут для Playback в секундах

[default]
; =========================================================
; Экстеншен 1001 - тестовое приветствие
; =========================================================
exten => 1001,1,Answer()
same => n,Playback(hello,${PLAYBACK_TIMEOUT})
same => n,Hangup()

; =========================================================
; Экстеншен 1002 - аварийное оповещение
; =========================================================
exten => 1002,1,Answer()
same => n,Playback(alarm1,${PLAYBACK_TIMEOUT})
same => n,Hangup()

; =========================================================
; Обработка входящих вызовов
; =========================================================
exten => _X.,1,NoOp(Входящий вызов на номер ${EXTEN})
same => n,Set(CALLERID(name)=${CALLERID(num)})
same => n,Dial(SIP/${EXTEN},${DIAL_TIMEOUT},tt)
same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hangup:failed)

same => n(failed),NoOp(Не удалось дозвониться до ${EXTEN})
same => n,Playback(vm-failed,${PLAYBACK_TIMEOUT})
same => n,Hangup()

same => n(hangup),Hangup()

; =========================================================
; Обработка экстренных ситуаций
; =========================================================
exten => h,1,NoOp(Завершение вызова)
same => n,System(logger -t Asterisk "Завершение вызова ${EXTEN}")

exten => i,1,NoOp(Неверный номер ${EXTEN})
same => n,Playback(invalid)
same => n,Hangup()

; =========================================================
; Системные экстеншены
; =========================================================
exten => t,1,NoOp(Таймаут вызова)
same => n,Playback(timeout)
same => n,Hangup()

exten => b,1,NoOp(Занято)
same => n,Playback(busy)
same => n,Hangup()

; Настройки логирования
same => n,Set(LOG_FILE=/var/log/asterisk/custom.log)
same => n,System(echo "Вызов на ${EXTEN} в $(date '+%Y-%m-%d %H:%M:%S')" >> ${LOG_FILE})

